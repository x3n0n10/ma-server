name: wrapper-lite
version: "0.1.1"
slug: wrapper_lite
description: Apple Music key service for the Apple Music Lossless provider in Music Assistant.
url: https://github.com/WorldObservationLog/wrapper/tree/lite
arch:
  - amd64
# host network so Music Assistant reaches it on 127.0.0.1:12340 without exposing it to the LAN
host_network: true
init: false
startup: services
boot: auto
# the launcher chroots into Apple's Android libraries inside a user namespace
privileged:
  - SYS_ADMIN
apparmor: false
stage: experimental
options:
  username: ""
  password: ""
  code: ""
schema:
  username: email
  password: password
  code: match(^(\d{6})?$)?
